apiVersion: v1
kind: Namespace
metadata:
  name: limit-range-example
---
apiVersion: v1
kind: LimitRange
metadata:
  name:  limit-range-example
  namespace: limit-range-example
spec:
  limits:
  - default:
      cpu: 500m
      memory: 500Mi
    defaultRequest:
      cpu: 200m
      memory: 300Mi
    max:
      cpu: "1"
      memory: "3Gi"
    min:
      cpu: 100m
      memory: 100Mi
    type: Container 